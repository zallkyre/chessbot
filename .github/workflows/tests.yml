name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Stockfish
        run: sudo apt-get update && sudo apt-get install -y stockfish
      - name: Install package
        run: pip install -e .
      - name: Test
        env:
          CHESSBOT_ENGINE: /usr/games/stockfish
        run: python -m unittest discover -s tests -v

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Stockfish
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Ask the API for the asset instead of hardcoding a name: upstream
          # renames these between releases (avx2/plain -> universal in sf_19).
          $rel = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/official-stockfish/Stockfish/releases/latest" `
            -Headers @{ "User-Agent" = "chessbot-ci" }
          $asset = $rel.assets | Where-Object { $_.name -like "*windows-x86-64*" } | Select-Object -First 1
          if (-not $asset) {
            throw "no windows x86-64 asset in $($rel.tag_name)"
          }
          Write-Host "downloading $($asset.name) from $($rel.tag_name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile sf.zip
          Expand-Archive sf.zip -DestinationPath sf
          $exe = (Get-ChildItem -Path sf -Recurse -Filter "stockfish*.exe" | Select-Object -First 1).FullName
          if (-not $exe) { throw "no stockfish binary in the release archive" }
          Write-Host "engine: $exe"
          "CHESSBOT_ENGINE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install package
        run: pip install -e .
      - name: Test
        run: python -m unittest discover -s tests -v
