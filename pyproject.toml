[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chessbot"
version = "0.2.0"
description = "Difficulty-slider chess bot and move grader built on Stockfish"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "zallkyre" }]
dependencies = ["python-chess>=1.10"]
keywords = ["chess", "stockfish", "bot", "engine", "uci", "analysis"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Games/Entertainment :: Board Games",
]

[project.scripts]
chessbot = "chessbot.__main__:main"

[project.urls]
Homepage = "https://github.com/zallkyre/chessbot"
Issues = "https://github.com/zallkyre/chessbot/issues"

[tool.setuptools.packages.find]
include = ["chessbot*"]

[tool.setuptools]
license-files = ["LICENSE"]
